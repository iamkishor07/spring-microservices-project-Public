name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [order-service, inventory-service, notification-service]

    steps:
      - name : checkout code
      - uses: actions/checkout@v4

      - name : set up JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Service
        run: |
          cd ${{ matrix.service }}
          mvn clean package